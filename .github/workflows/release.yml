name: Build Windows and Linux release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Python 3.12 keeps the portable Linux Core below the 250 MB cap;
          # the Windows validation/build remains on Python 3.13 below.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build-linux.lock

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev build-essential pkg-config \
            portaudio19-dev libcairo2-dev libgirepository-2.0-dev \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb

      - name: Build and validate Linux Core
        run: bash build_linux.sh

      - name: Smoke visual do HUD no Linux
        run: xvfb-run --auto-servernum .venv-linux/bin/python scripts/hud_visual_smoke.py --duration-ms 180

      - name: Package validated Linux application
        run: |
          version=$(python -c "from localwhisper import __version__; print(__version__)")
          test -x dist/QuantumScribe/QuantumScribe
          test -f dist/QuantumScribe-inventory.json
          tar -czf "QuantumScribe-Core-$version-Linux-x64.tar.gz" \
            -C dist QuantumScribe -C .. install_linux_shortcut.sh
          sha256sum "QuantumScribe-Core-$version-Linux-x64.tar.gz" > SHA256SUMS-Linux.txt

      - name: Store validated Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            QuantumScribe-Core-*-Linux-x64.tar.gz
            SHA256SUMS-Linux.txt

  build-windows:
    needs: build-linux
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.lock
            requirements-build.lock
            requirements-test.lock
            requirements-cuda-component.txt
            requirements-vad-component.txt

      - name: Download validated Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release
          path: linux-release

      - name: Install validation dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock

      - name: Validate release candidate
        run: |
          python -m compileall -q main.py localwhisper scripts tests
          python -m ruff check main.py localwhisper scripts tests
          python -m pytest -q
          python -m pip check
          python -m pip_audit -r requirements-core.lock --no-deps --disable-pip --progress-spinner off
          python -m pip_audit -r requirements-cuda-component.txt --no-deps --disable-pip --progress-spinner off
          python -m pip_audit -r requirements-vad-component.txt --no-deps --disable-pip --progress-spinner off

      - name: Install NSIS
        run: choco install nsis --version=3.11.0 --no-progress -y

      - name: Build and inventory Core
        shell: pwsh
        run: .\build.ps1 -Installer

      - name: Assert Core has no forbidden optional runtimes
        shell: pwsh
        run: |
          $report = Get-Content dist\QuantumScribe-inventory.json | ConvertFrom-Json
          if (-not $report.policy.passed) {
            throw "Inventário do Core reprovado: $($report.forbidden_matches | ConvertTo-Json -Compress)"
          }

      - name: Build and validate optional components
        shell: pwsh
        run: .\scripts\build_optional_components.ps1

      - name: Verify Linux checksum before publication
        shell: pwsh
        run: |
          $linuxArchive = Get-ChildItem linux-release\QuantumScribe-Core-*-Linux-x64.tar.gz -File | Select-Object -First 1
          if (-not $linuxArchive) { throw "Artefato Linux validado ausente." }
          $expected = (Get-Content linux-release\SHA256SUMS-Linux.txt).Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash $linuxArchive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checksum Linux não confere." }

      - name: Create consolidated checksums
        shell: pwsh
        run: |
          $version = (Select-String -Path localwhisper\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $linuxArchive = Get-ChildItem linux-release\QuantumScribe-Core-*-Linux-x64.tar.gz -File -ErrorAction Stop | Select-Object -First 1
          $installer = Get-ChildItem dist\QuantumScribe-Setup-*-Windows-x64.exe -File -ErrorAction Stop | Select-Object -First 1
          $cuda = Get-ChildItem "dist\QuantumScribe-CUDA-$version-Windows-x64.zip" -File -ErrorAction Stop
          $vad = Get-ChildItem "dist\QuantumScribe-SileroVAD-$version-Windows-x64.zip" -File -ErrorAction Stop
          $files = @($installer.FullName, $cuda.FullName, $vad.FullName)
          $linuxLines = Get-Content linux-release\SHA256SUMS-Linux.txt
          $allLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          @($linuxLines) + @($allLines) | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Store validated Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/QuantumScribe-Setup-*-Windows-x64.exe
            dist/QuantumScribe-CUDA-*-Windows-x64.zip
            dist/QuantumScribe-SileroVAD-*-Windows-x64.zip
            dist/QuantumScribe-inventory.json
            SHA256SUMS.txt

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release-assets

      - name: Publish validated release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          assets=(QuantumScribe-Core-*-Linux-x64.tar.gz \
            dist/QuantumScribe-Setup-*-Windows-x64.exe \
            dist/QuantumScribe-CUDA-*-Windows-x64.zip \
            dist/QuantumScribe-SileroVAD-*-Windows-x64.zip \
            SHA256SUMS.txt)
          gh release create "$tag" --repo "${{ github.repository }}" "${assets[@]}" --draft --generate-notes --verify-tag
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false --latest
