[project]
name = "quantumscribe"
version = "2.3.0"
description = "Ditado por voz local para Windows e Linux com faster-whisper."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Natan Melquiades" }]
keywords = ["speech-to-text", "whisper", "dictation", "windows", "linux", "offline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
    ".venv",
    "build",
    "dist",
    "temp_test",
    ".ai",
    ".aiox",
    ".aiox-core",
    ".antigravity",
    ".claude",
    ".codex",
    ".cursor",
    ".gemini",
    ".kimi",
    ".agents",
    "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "W291", "W293"]
